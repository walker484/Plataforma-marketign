
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAVI WALKER | Entrada</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  font-family: Arial, sans-serif;
  color: #174ea6;
  padding: 20px;
}

.painel {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 35px 25px;
  border: 1px solid #dce9ff;
  border-radius: 14px;
  box-shadow: 0 4px 18px #174ea615;
}

h1 {
  margin: 0;
  font-size: 26px;
}

h2 {
  margin-top: 28px;
  font-size: 21px;
}

p {
  color: #6681aa;
  line-height: 1.6;
}

.carregando {
  margin: 25px 0;
  font-size: 15px;
}

.erro {
  display: none;
  margin-top: 20px;
  color: #b42318;
  background: #fff1f0;
  padding: 12px;
  border-radius: 8px;
}

button {
  margin-top: 15px;
  padding: 12px 20px;
  background: #174ea6;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<section class="painel">

  <h1>DAVI WALKER</h1>
  <p>Marketing Digital</p>

  <h2>Bem-vindo à plataforma!</h2>

  <div class="carregando" id="carregando">
    Identificando seu perfil...
  </div>

  <div class="erro" id="erro">
    Não foi possível identificar seu acesso.
    Entre novamente pela página de login.
    <br>
    <button onclick="voltarLogin()">Voltar ao login</button>
  </div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsZUHfZ7EBatnMwwR4FKgPWLjZybIm9KI",
  authDomain: "walker-midia.firebaseapp.com",
  databaseURL: "https://walker-midia-default-rtdb.firebaseio.com",
  projectId: "walker-midia",
  storageBucket: "walker-midia.firebasestorage.app",
  messagingSenderId: "223143706690",
  appId: "1:223143706690:web:3c9e81a0d21173a59caddb"
};

const ADMIN_UID = "7TAC1PMMwAMyrL3LUcboCHKjWJq2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const carregando = document.getElementById("carregando");
const erro = document.getElementById("erro");

onAuthStateChanged(auth, usuario => {

  if (!usuario) {
    window.location.replace("./index.html");
    return;
  }

  const perfilSalvo = sessionStorage.getItem("perfilDaviWalker");

  // CONFIRMAR ADMINISTRADOR PELO UID
  if (usuario.uid === ADMIN_UID) {

    sessionStorage.setItem("perfilDaviWalker", "admin");

    carregando.textContent = "Abrindo painel administrativo...";

    window.location.replace("./admin.html");
    return;
  }

  // CLIENTE
  if (perfilSalvo === "cliente") {

    carregando.textContent = "Abrindo área do cliente...";

    window.location.replace("./cliente.html");
    return;
  }

  // PERFIL NÃO IDENTIFICADO
  carregando.style.display = "none";
  erro.style.display = "block";

});

window.voltarLogin = function() {
  window.location.href = "./index.html";
};

</script>

</body>
</html>
